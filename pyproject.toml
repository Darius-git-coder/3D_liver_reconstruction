[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liver-sparse-reconstruction-core"
version = "0.1.0"
description = "Companion code and curated artifacts for a bachelor thesis on sparse 3D liver reconstruction from CT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "nibabel",
  "numpy",
  "pandas",
  "scipy",
  "torch",
  "tqdm",
]

[tool.setuptools]
packages = ["inpainting3d", "scripts"]
